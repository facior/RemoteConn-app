[workspace]
resolver = "2"
members = ["crates/*", "desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
rust-version = "1.85"

[workspace.dependencies]
rc-proto = { path = "crates/rc-proto" }
rc-crypto = { path = "crates/rc-crypto" }
rc-transport = { path = "crates/rc-transport" }
rc-capture = { path = "crates/rc-capture" }
rc-codec = { path = "crates/rc-codec" }
rc-input = { path = "crates/rc-input" }
rc-session = { path = "crates/rc-session" }
rc-rendezvous = { path = "crates/rc-rendezvous" }
rc-clipboard = { path = "crates/rc-clipboard" }

prost = "0.13"
prost-build = "0.13"
protox = "0.7"
snow = "0.9"
spake2 = "0.4"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
blake3 = "1"
zeroize = "1"
thiserror = "2"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tracing = "0.1"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
windows = "0.62"
openh264 = "0.9"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }

# Argon2 is deliberately slow; unoptimized it makes debug builds and tests crawl.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

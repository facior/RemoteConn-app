name: CI

on:
  push:
  pull_request:

# The connection tests start the real rc-server. Set the repository variable
# SERVER_REPO (e.g. "your-org/RemoteConn-server") to build it here; without it
# those tests are skipped.
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        if: ${{ vars.SERVER_REPO != '' }}
        with:
          repository: ${{ vars.SERVER_REPO }}
          path: server
          token: ${{ secrets.SERVER_REPO_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # tauri::generate_context! needs the built frontend.
      - run: npm ci && npm run build
        working-directory: desktop
      - name: Build rc-server for the connection tests
        if: ${{ vars.SERVER_REPO != '' }}
        shell: bash
        run: |
          cargo build --release -p rc-server --manifest-path server/Cargo.toml
          echo "RC_SERVER_BIN=$GITHUB_WORKSPACE/server/target/release/rc-server${{ runner.os == 'Windows' && '.exe' || '' }}" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
